name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact lowercase source SHA (defaults to the selected workflow commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jxpkg-ci-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    uses: JUXON-AI/jxpkg/.github/workflows/ci-runner.yml@f675cee2a78fb9d0a737b37a32a11415afc4e83e
    with:
      ref: ${{ inputs.ref || github.sha }}
    secrets:
      FEISHU_CICD_WEBHOOK_URL: ${{ secrets.FEISHU_CICD_WEBHOOK_URL }}
