name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify (defaults to the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A same-repository branch push and its pull_request event share this key,
  # so only one full untrusted run consumes GitHub-hosted capacity. A fork's
  # repository name keeps an identically named branch isolated.
  group: jxpkg-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify execution
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.classify.outputs.trusted }}
      ref: ${{ steps.classify.outputs.ref }}
    steps:
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.sha }}
          EVENT_GIT_REF: ${{ github.ref }}
          INPUT_REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          trusted=false
          # jxpkg is public. Pull requests always stay on GitHub-hosted runners,
          # including same-repository PRs, so PR-controlled code cannot reach JXlan.
          # Only main/tag pushes and an explicit dispatch of the allowlisted main
          # workflow may enter JXlan. Feature-branch pushes use GitHub-hosted CI;
          # maintainers can still validate one exact ref through workflow_dispatch.
          if [[ "$REPOSITORY" == "JUXON-AI/jxpkg" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              trusted=true
            elif [[ "$EVENT_NAME" == "push" && ( "$EVENT_GIT_REF" == "refs/heads/main" || "$EVENT_GIT_REF" == refs/tags/* ) ]]; then
              trusted=true
            fi
          fi
          ref="${INPUT_REF:-$EVENT_REF}"
          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

  trusted-ci:
    name: JXlan trusted CI
    needs: classify
    if: needs.classify.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, jxlan-ci]
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          # All JXlan runners share the host Go caches. Uploading that multi-GB
          # cache again in the post step blocks runner turnover and adds no reuse.
          cache: false
      - name: Verify source and dependencies
        run: make check
      - name: Test and compile
        env:
          JXPKG_TEST_REDIS_ADDR: 127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: |
          make test
          make test-race
          make build

  untrusted-ci:
    name: GitHub-hosted untrusted CI
    needs: classify
    if: needs.classify.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.classify.outputs.ref }}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source and dependencies
        run: make check
      - name: Test and compile
        env:
          JXPKG_TEST_REDIS_ADDR: 127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: |
          make test
          make test-race
          make build

  required:
    name: Required
    if: always()
    needs: [classify, trusted-ci, untrusted-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Require one successful execution path
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TRUSTED_RESULT: ${{ needs.trusted-ci.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted-ci.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          if [[ "$TRUSTED_RESULT" == "success" && "$UNTRUSTED_RESULT" == "skipped" ]]; then
            exit 0
          fi
          if [[ "$TRUSTED_RESULT" == "skipped" && "$UNTRUSTED_RESULT" == "success" ]]; then
            exit 0
          fi
          printf 'trusted=%s untrusted=%s\n' "$TRUSTED_RESULT" "$UNTRUSTED_RESULT" >&2
          exit 1

  notify:
    name: Notify Feishu
    needs: required
    if: ${{ always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Send result to Feishu
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_CICD_WEBHOOK_URL }}
          RESULT: ${{ needs.required.result }}
          SOURCE_REF: ${{ inputs.ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          test -n "$FEISHU_WEBHOOK_URL" || {
            echo '::warning::FEISHU_CICD_WEBHOOK_URL is empty; notification was not sent'
            exit 1
          }
          echo "::add-mask::$FEISHU_WEBHOOK_URL"

          case "$RESULT" in
            success) result_label='✅ 成功' ;;
            failure) result_label='❌ 失败' ;;
            cancelled) result_label='⏹️ 已取消' ;;
            skipped) result_label='⏭️ 已跳过' ;;
            *) result_label='⚠️ 状态未知' ;;
          esac

          message="[CI][$result_label]
          仓库: $GITHUB_REPOSITORY
          行为: JXpKG 源码验证
          来源: $SOURCE_REF
          提交: ${SOURCE_SHA:0:12}
          事件: $GITHUB_EVENT_NAME
          执行者: $GITHUB_ACTOR
          详情: 仅表示 CI 完成，不代表镜像已发布或已部署
          运行: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -cn --arg text "$message" '{msg_type:"text",content:{text:$text}}')
          response_file=$(mktemp "$RUNNER_TEMP/feishu-response.XXXXXX")
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-all-errors \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload" \
            "$FEISHU_WEBHOOK_URL")
          test "$http_status" = 200
          jq -e '(.StatusCode? == 0) or (.code? == 0)' "$response_file" >/dev/null
