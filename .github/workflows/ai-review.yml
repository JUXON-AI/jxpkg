name: AI Review

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: jxpkg-ai-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Review completed CI
    if: github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Review pull request
        uses: JUXON-AI/jxaction@99ec68e31b5f163df74b1d1f813c528559a5d4d2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model-base-url: ${{ vars.AI_REVIEW_BASE_URL }}
          model-api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          model: ${{ vars.AI_REVIEW_MODEL }}
          feishu-webhook: ${{ secrets.FEISHU_CICD_WEBHOOK_URL }}
