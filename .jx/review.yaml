version: 1
include_base_policies:
  - base
  - business
  - api
  - auth
  - data
  - cicd

repository_context:
  - jxpkg owns stable Go infrastructure and protocol capabilities shared by JUXON services; service-specific workflows, business models, deployment manifests, and one-off repair tools remain in their owning repositories.
  - A new public API normally needs at least two real consumers or a documented shared-protocol reason, and downstream compatibility must be evaluated before merge and release.
  - This is a public repository: untrusted pull-request code stays on GitHub-hosted runners, while only explicitly trusted refs may use JXlan or privileged credentials.

business_contract:
  - Existing exported APIs remain source- and behavior-compatible unless the PR supplies a versioned migration plan, identifies consumers, and defines a safe adoption and removal window.
  - Browser Session, internal workload identity, and Bearer authentication are separate route modes; middleware fails closed and never introduces an implicit fallback.
  - Shared HTTP and authentication primitives preserve request identity, origin, CSRF, audience, issuer, replay, expiry, action allowlist, and stable error semantics without leaking credentials.
  - Shared packages expose the smallest product-neutral contract and do not import or encode jxaccount, jxone, jxx, or another service's business ownership.
  - Database migration and external resource initialization stay explicit application actions and never occur through package import or hidden startup side effects.
  - Retries, mutexes, storage, task, mail, model, and network helpers define cancellation, timeout, idempotency, concurrency, and failure semantics suitable for multiple consumers.
  - Secrets, tokens, cookies, verification codes, key material, private DSNs, and credential-bearing configuration never enter logs, errors, examples, fixtures, or review output.
  - go.mod, go.sum, vendor, tags, and release notes remain coherent; vendor is regenerated with the toolchain and is never edited manually.
